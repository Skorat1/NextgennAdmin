<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="nextGennGradAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="nextGennDiagAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="nextGennGlowShadowAdmin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0066FF" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#nextGennGlowShadowAdmin)">
    <!-- Rounded Cyber Shield / Squircle Container -->
    <rect
      x="2"
      y="2"
      width="40"
      height="40"
      rx="12"
      fill="#090E1A"
      stroke="url(#nextGennGradAdmin)"
      stroke-width="1.75"
    />

    <!-- Left Vertical Pillar of 'N' -->
    <rect
      x="9"
      y="10"
      width="6.5"
      height="24"
      rx="3.25"
      fill="url(#nextGennGradAdmin)"
    />

    <!-- Right Vertical Pillar of 'N' -->
    <rect
      x="28.5"
      y="10"
      width="6.5"
      height="24"
      rx="3.25"
      fill="url(#nextGennGradAdmin)"
    />

    <!-- Dynamic Diagonal Slash of 'N' with Controller Accent -->
    <path
      d="M 12.5 12 L 31.5 32"
      stroke="url(#nextGennDiagAdmin)"
      stroke-width="6"
      stroke-linecap="round"
    />

    <!-- Cyber Controller Glow Node -->
    <circle cx="22" cy="22" r="2.8" fill="#FFFFFF" />
    <circle cx="22" cy="22" r="1.5" fill="#00F2FE" />

    <!-- Controller D-Pad Cross Accent on Left Bar -->
    <circle cx="12.25" cy="16" r="1.2" fill="#FFFFFF" opacity="0.9" />
    <circle cx="12.25" cy="28" r="1.2" fill="#FFFFFF" opacity="0.9" />

    <!-- Action Accent on Right Bar -->
    <circle cx="31.75" cy="16" r="1.2" fill="#00F2FE" />
    <circle cx="31.75" cy="28" r="1.2" fill="#A78BFA" />
  </g>
</svg>
